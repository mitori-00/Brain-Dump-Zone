<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>Brain Dump Incinerator (Web Notion Dark Mode Ready)</title>
<style>
  :root {
    --bg-color: transparent;
    --card-bg: #FFFFFF;
    --card-border: rgba(55, 53, 47, 0.14);
    --card-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    --title-color: #37352F;
    --badge-bg: #EAE4F2;
    --badge-text: #6940A5;
    --input-bg: #FFFFFF;
    --input-focus-bg: #FCFAFF;
    --input-border: rgba(105, 64, 165, 0.35);
    --input-focus-border: #6940A5;
    --input-text: #37352F;
    --placeholder-color: #9B9A97;
    --burn-bg: #EAE4F2;
    --burn-text: #6940A5;
    --ash-title: #6940A5;
    --ash-sub: #787774;
    --btn-bg: #6940A5;
    --btn-hover: #5B3593;
    --btn-active: #4E2C80;
    --toggle-dot: rgba(55, 53, 47, 0.22);
  }

  /* 다크모드 클래스가 적용되거나 OS가 다크모드일 때 */
  html.dark,
  body.dark {
    --bg-color: #191919;
    --card-bg: #202020;
    --card-border: rgba(255, 255, 255, 0.1);
    --card-shadow: 0 2px 10px rgba(0, 0, 0, 0.25);
    --title-color: #EBEBEB;
    --badge-bg: #322742;
    --badge-text: #C4A3F5;
    --input-bg: #191919;
    --input-focus-bg: #1E1B24;
    --input-border: rgba(168, 127, 232, 0.35);
    --input-focus-border: #9A6DD7;
    --input-text: #EBEBEB;
    --placeholder-color: #7F7F7F;
    --burn-bg: #322742;
    --burn-text: #D2B8F8;
    --ash-title: #C4A3F5;
    --ash-sub: #9B9B9B;
    --btn-bg: #8256C2;
    --btn-hover: #9064D0;
    --btn-active: #7348B2;
    --toggle-dot: rgba(255, 255, 255, 0.25);
  }

  @media (prefers-color-scheme: dark) {
    :root:not(.light) {
      --bg-color: #191919;
      --card-bg: #202020;
      --card-border: rgba(255, 255, 255, 0.1);
      --card-shadow: 0 2px 10px rgba(0, 0, 0, 0.25);
      --title-color: #EBEBEB;
      --badge-bg: #322742;
      --badge-text: #C4A3F5;
      --input-bg: #191919;
      --input-focus-bg: #1E1B24;
      --input-border: rgba(168, 127, 232, 0.35);
      --input-focus-border: #9A6DD7;
      --input-text: #EBEBEB;
      --placeholder-color: #7F7F7F;
      --burn-bg: #322742;
      --burn-text: #D2B8F8;
      --ash-title: #C4A3F5;
      --ash-sub: #9B9B9B;
      --btn-bg: #8256C2;
      --btn-hover: #9064D0;
      --btn-active: #7348B2;
      --toggle-dot: rgba(255, 255, 255, 0.25);
    }
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: var(--bg-color) !important;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    transition: background-color 0.2s ease;
  }

  body {
    padding: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    position: relative;
  }

  /* 플랫한 노션 스타일 메인 컨테이너 */
  .incinerator-card {
    width: 100%;
    max-width: 560px;
    background-color: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 18px;
    box-shadow: var(--card-shadow);
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: background-color 0.2s ease, border-color 0.2s ease;
  }

  /* 상단 헤더 영역 (일반 텍스트 크기 볼드 타이틀 + 우측 하단 뱃지) */
  .header-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .title-row {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 14px;
    font-weight: 700;
    color: var(--title-color);
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  .badge-row {
    display: flex;
    justify-content: flex-end;
  }

  .privacy-badge {
    background-color: var(--badge-bg);
    color: var(--badge-text);
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  /* 텍스트 입력 영역 */
  .dump-wrapper {
    position: relative;
    width: 100%;
  }

  textarea {
    width: 100%;
    height: 120px;
    padding: 12px 14px;
    border: 1.5px dashed var(--input-border);
    border-radius: 8px;
    background-color: var(--input-bg);
    color: var(--input-text);
    font-family: inherit;
    font-size: 14px;
    line-height: 1.5;
    resize: none;
    outline: none;
    transition: border-color 0.2s ease, background-color 0.2s ease, filter 0.55s ease, opacity 0.55s ease, transform 0.55s ease;
  }

  textarea:focus {
    border-color: var(--input-focus-border);
    background-color: var(--input-focus-bg);
  }

  textarea::placeholder {
    color: var(--placeholder-color);
  }

  /* 소각 애니메이션 */
  textarea.burning {
    background-color: var(--burn-bg);
    border-color: var(--input-focus-border);
    color: var(--burn-text);
    filter: blur(5px) brightness(1.15);
    opacity: 0;
    transform: translateY(-10px) scale(0.98);
  }

  /* 소각 완료 메시지 */
  .ash-message {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: var(--ash-title);
    font-weight: 700;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .ash-message.visible {
    opacity: 1;
  }

  .ash-sub {
    font-size: 12px;
    font-weight: 400;
    color: var(--ash-sub);
    margin-top: 4px;
  }

  /* 플랫 노션 퍼플 버튼 */
  .burn-btn {
    width: 100%;
    height: 44px;
    background-color: var(--btn-bg);
    border: none;
    border-radius: 8px;
    color: #FFFFFF;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.05em;
    cursor: pointer;
    outline: none;
    touch-action: manipulation;
    transition: background-color 0.15s ease, transform 0.08s ease;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
  }

  .burn-btn:hover {
    background-color: var(--btn-hover);
  }

  .burn-btn:active,
  .burn-btn.pressed {
    transform: scale(0.985);
    background-color: var(--btn-active);
  }

  /* 우측 하단 초소형 수동 테마 전환 도트 */
  .theme-dot {
    position: fixed;
    bottom: 6px;
    right: 6px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: none;
    background-color: var(--toggle-dot);
    cursor: pointer;
    padding: 0;
    opacity: 0.4;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .theme-dot:hover {
    opacity: 1;
    transform: scale(1.3);
  }

  /* 모바일 최적화 */
  @media (max-width: 480px) {
    body { padding: 8px; }
    .incinerator-card { padding: 14px; }
    textarea { height: 100px; font-size: 16px; }
  }
</style>
</head>
<body>

  <div class="incinerator-card">
    <div class="header-group">
      <div class="title-row">
        <span>🧠</span>
        <span>MIND DUMP INCINERATOR</span>
      </div>
      <div class="badge-row">
        <span class="privacy-badge">NOT SAVED • ZERO TRACE</span>
      </div>
    </div>

    <div class="dump-wrapper">
      <textarea id="dumpInput" placeholder="Dump your anxious thoughts..."></textarea>
      <div class="ash-message" id="ashMsg">
        <span>✨ Cleared away. Your mind is light.</span>
        <span class="ash-sub">Take a deep breath and return to one tiny step.</span>
      </div>
    </div>

    <button class="burn-btn" id="burnBtn" aria-label="Burn Thoughts">
      <span>🔥</span>
      <span>BURN THOUGHTS</span>
    </button>
  </div>

  <!-- 수동 테마 전환 도트 (클릭 시 라이트/다크 즉시 토글) -->
  <button class="theme-dot" id="themeToggle" title="Toggle Dark/Light Mode" aria-label="Toggle Theme"></button>

  <script>
    // 1. URL 파라미터(?theme=dark 또는 ?theme=light) 및 저장된 테마 확인
    const urlParams = new URLSearchParams(window.location.search);
    const paramTheme = urlParams.get('theme');
    const savedTheme = localStorage.getItem('incinerator-theme');
    const rootEl = document.documentElement;

    function applyTheme(mode) {
      rootEl.classList.remove('dark', 'light');
      if (mode === 'dark') {
        rootEl.classList.add('dark');
      } else if (mode === 'light') {
        rootEl.classList.add('light');
      }
    }

    if (paramTheme === 'dark' || paramTheme === 'light') {
      applyTheme(paramTheme);
    } else if (savedTheme) {
      applyTheme(savedTheme);
    }

    // 2. 수동 테마 전환 도트 클릭 이벤트
    document.getElementById('themeToggle').addEventListener('click', () => {
      const isCurrentlyDark = rootEl.classList.contains('dark') ||
        (!rootEl.classList.contains('light') && window.matchMedia('(prefers-color-scheme: dark)').matches);
      const nextTheme = isCurrentlyDark ? 'light' : 'dark';
      applyTheme(nextTheme);
      localStorage.setItem('incinerator-theme', nextTheme);
    });

    // 3. 소각기 작동 로직
    const input = document.getElementById('dumpInput');
    const burnBtn = document.getElementById('burnBtn');
    const ashMsg = document.getElementById('ashMsg');
    let isBurning = false;

    function burnThoughts() {
      if (isBurning) return;

      if (!input.value.trim()) {
        input.focus();
        return;
      }

      isBurning = true;
      input.classList.add('burning');

      setTimeout(() => {
        input.value = '';
        ashMsg.classList.add('visible');
      }, 500);

      setTimeout(() => {
        ashMsg.classList.remove('visible');
        input.classList.remove('burning');
        isBurning = false;
      }, 2100);
    }

    burnBtn.addEventListener('click', burnThoughts);

    burnBtn.addEventListener('touchstart', () => burnBtn.classList.add('pressed'), { passive: true });
    burnBtn.addEventListener('touchend', () => burnBtn.classList.remove('pressed'));

    input.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        burnBtn.classList.add('pressed');
        burnThoughts();
        setTimeout(() => burnBtn.classList.remove('pressed'), 120);
      }
    });
  </script>

</body>
</html>
